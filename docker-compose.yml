version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  reservation-service:
    build: ./reservation-service
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      redis:
        condition: service_healthy

  identity-service:
    build: ./identity-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002

  catalog-service:
    build: ./catalog-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003

  billing-service:
    build: ./billing-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004

  notification-service:
    build: ./notification-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
