version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  reservation-service:
    build: ./reservation-service
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      redis:
        condition: service_healthy
