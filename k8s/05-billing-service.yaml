apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: ticketing-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: billing-service }
  template:
    metadata:
      labels: { app: billing-service }
    spec:
      containers:
        - name: billing-service
          image: ticketing-platform/billing-service:latest
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: ticketing-platform
spec:
  selector: { app: billing-service }
  ports:
    - port: 3004
      targetPort: 3004
