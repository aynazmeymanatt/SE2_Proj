# API Gateway entry point (see the Deployment Diagram: "Load Balancer /
# Ingress" -> API Gateway pods). Requires an ingress controller installed
# in-cluster (e.g. the AWS Load Balancer Controller referenced in the
# Terraform module's eks.tf comments, or ingress-nginx for local/dev use).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-platform-ingress
  namespace: ticketing-platform
  annotations:
    nginx.ingress.class: "nginx"
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: identity-service, port: { number: 3002 } }
          - path: /events
            pathType: Prefix
            backend:
              service: { name: catalog-service, port: { number: 3003 } }
          - path: /seats
            pathType: Prefix
            backend:
              service: { name: reservation-service, port: { number: 3001 } }
          - path: /checkout
            pathType: Prefix
            backend:
              service: { name: billing-service, port: { number: 3004 } }
          - path: /internal/order-status-changed
            pathType: Prefix
            backend:
              service: { name: notification-service, port: { number: 3005 } }
