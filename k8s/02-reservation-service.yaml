apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: ticketing-platform
spec:
  replicas: 3
  selector:
    matchLabels: { app: reservation-service }
  template:
    metadata:
      labels: { app: reservation-service }
    spec:
      containers:
        - name: reservation-service
          image: ticketing-platform/reservation-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef: { name: platform-config, key: REDIS_URL }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-service
  namespace: ticketing-platform
spec:
  selector: { app: reservation-service }
  ports:
    - port: 3001
      targetPort: 3001
---
# Auto-scales worker pods between 3 and 15 replicas under on-sale traffic
# spikes, per the Deployment Diagram and the eks_node_min/max_size
# variables in the Terraform module.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reservation-service-hpa
  namespace: ticketing-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reservation-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
