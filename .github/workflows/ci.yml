name: CI

# Mirrors the pipeline described in the Agile Delivery Plan (Section 8):
# build -> unit test, running on every push and pull request, for every
# service in the platform.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-all-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - reservation-service
          - identity-service
          - catalog-service
          - billing-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm test

  docker-build:
    name: Build all service images
    runs-on: ubuntu-latest
    needs: [test-all-services]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          for svc in reservation-service identity-service catalog-service billing-service notification-service; do
            echo "Building $svc..."
            docker build -t "ticketing-platform/$svc:ci" "./$svc"
          done
